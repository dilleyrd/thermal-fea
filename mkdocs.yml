site_name: ThermalFEA user guide
site_description: User guide of ThermalFEA, a 2D steady-state and transient thermal finite-element program.
site_url: https://dilleyrd.github.io/thermal-fea/
repo_url: https://github.com/dilleyrd/thermal-fea
repo_name: GitHub
edit_uri: ""
docs_dir: guide
site_dir: site

theme:
  name: readthedocs

markdown_extensions:
  - admonition
  - attr_list
  - fenced_code
  - tables
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - Installation: installation.md
  - Getting started: getting-started.md
  - Tutorials:
      - "NAFEMS T4 steady plate": tutorials/t4-plate.md
      - "Transient quench of a fin": tutorials/fin-quench.md
      - "Cold plate with a water stream": tutorials/cold-plate.md
  - Examples:
      - "Main closure of a canned-motor pump": examples/pump-closure.md
  - Reference:
      - Units: units.md
      - Materials: materials.md
      - Correlations: correlations.md
      - Theory: theory.md
      - Verification: verification.md
  - Limitations: limitations.md
